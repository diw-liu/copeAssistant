basePath: /
host: localhost:8080
info:
  contact: {}
  description: API docs for Copassistant backend.
  title: Copassistant Backend API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /ws:
    get:
      description: Upgrades HTTP connection to WebSocket for real-time chat messaging
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: WebSocket chat handshake
      tags:
      - chat
swagger: "2.0"
